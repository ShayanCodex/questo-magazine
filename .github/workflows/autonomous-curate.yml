name: Autonomous Curator Agent

on:
  schedule:
    # Run every Sunday at 06:00 UTC (The Sunday Dispatch autonomous curation)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic or Title to autonomously curate'
        required: false
        default: 'Modern Architectural Brutalism'
      scrape_url:
        description: 'Optional webpage URL to scrape and convert'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  curate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Autonomous Curator Agent
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.scrape_url }}" ]; then
            node scripts/autonomous-curator.mjs scrape "${{ github.event.inputs.scrape_url }}"
          else
            node scripts/autonomous-curator.mjs curate "${{ github.event.inputs.topic || 'Modern Architectural Brutalism' }}"
          fi

      - name: Validate Pipeline
        run: |
          npm run validate-content
          npm run lint
          npm run typecheck

      - name: Commit and Push Curated Content
        run: |
          git config user.name "Questo Autonomous Curator [bot]"
          git config user.email "bot@questo.local"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(editorial): autonomously publish curated monograph"
            git push origin HEAD:${{ github.ref_name }}
          fi
