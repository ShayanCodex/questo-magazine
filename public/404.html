<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Questo</title>
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      --bg: #FBFBFA;
      --text: #111110;
      --muted: #6E6D6A;
      --accent: #D83A17;
      --border: #E4E4E0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D0D0C;
        --text: #EDEDEB;
        --muted: #94938F;
        --accent: #FF5436;
        --border: #262624;
      }
    }
    body {
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .code {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      font-size: 1.125rem;
      max-width: 400px;
      margin: 0 auto 2rem;
    }
    a {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <p>The story or page you are looking for does not exist or has been moved.</p>
  <a href="/">Return to publications</a>
</body>
</html>
